name: Release

# Pushing a tag such as v1.1.0 builds every download, checks that each one starts on its own
# system, and publishes a GitHub release with the notes from docs/releases/<version>.md, the
# checksums and the source code of every bundled tool.  Running the workflow by hand builds and
# checks everything without publishing (the files are kept as workflow artifacts).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        name: Version and release notes
        run: |
          code=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' discforge/__init__.py)
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            [ "${GITHUB_REF_NAME#v}" = "$code" ] || { echo "tag $GITHUB_REF_NAME != __version__ $code"; exit 1; }
          fi
          test -f "docs/releases/$code.md"
          echo "version=$code" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux ${{ matrix.arch }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, os: ubuntu-22.04 }        # glibc 2.35: Ubuntu 22.04+, Debian 12+, Fedora 36+ ...
          - { arch: aarch64, os: ubuntu-24.04-arm }   # PySide6 needs glibc 2.39 on arm64
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Build packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential m4 patchelf \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libxcb-cursor0
      - name: Burning tools
        run: bash packaging/tools/linux.sh build/tools build/tool-sources
      - name: Freeze
        run: |
          pip install -r packaging/requirements-build.txt
          python packaging/build.py --version "$VERSION" --tools build/tools --no-appimage --out dist
      - name: Check the download starts
        run: |
          mkdir -p build/check && tar -xzf "dist/DiscForge-$VERSION-linux-${{ matrix.arch }}.tar.gz" -C build/check
          app=build/check/DiscForge
          "$app/discforge" --version
          "$app/discforge" doctor
          DISCFORGE_SELF_TEST_REPORT=$PWD/build/self-test.txt QT_QPA_PLATFORM=offscreen "$app/DiscForge" --self-test \
            || { cat build/self-test.txt; exit 1; }
          cat build/self-test.txt
          grep -q "bundled" build/self-test.txt
          # every bundled tool must start from inside the download, with only its own libraries
          t="$app/tools/bin"
          "$t/cdrecord" -version 2>&1 | grep -i "cdrecord"
          "$t/readcd" -version 2>&1 | grep -i "readcd"
          "$t/mkisofs" -version 2>&1 | grep -i "mkisofs"
          { "$t/cdrdao" 2>&1 || true; } | grep -i "cdrdao version"
          { "$t/growisofs" -version 2>&1 || true; } | grep -i "growisofs"
          "$t/7zz" i | grep "7-Zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sources-linux-${{ matrix.arch }}
          path: build/tool-sources/*
          if-no-files-found: error

  appimage:
    name: AppImages
    needs: [version, linux]
    runs-on: ubuntu-24.04          # appimagetool runs on x86_64 and packs both architectures
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: linux-*
          path: build/linux
          merge-multiple: true
      - name: Build
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1
          pip install -r packaging/requirements-build.txt
          for arch in x86_64 aarch64; do
            mkdir -p "build/src-$arch"
            tar -xzf "build/linux/DiscForge-$VERSION-linux-$arch.tar.gz" -C "build/src-$arch"
            python packaging/build.py --appimage-from "build/src-$arch/DiscForge" --arch "$arch" \
              --version "$VERSION" --out dist
          done
      - name: Check the x86_64 AppImage starts
        run: |
          img="dist/DiscForge-$VERSION-linux-x86_64.AppImage"
          chmod +x "$img"
          APPIMAGE_EXTRACT_AND_RUN=1 "$img" --version
          APPIMAGE_EXTRACT_AND_RUN=1 "$img" doctor
          APPIMAGE_EXTRACT_AND_RUN=1 QT_QPA_PLATFORM=offscreen DISCFORGE_SELF_TEST_REPORT=$PWD/st.txt \
            "$img" --self-test || { cat st.txt; exit 1; }
          cat st.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appimages
          path: dist/*.AppImage
          if-no-files-found: error

  windows:
    name: Windows x86_64
    needs: version
    runs-on: windows-2025
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Burning tools
        shell: pwsh
        run: ./packaging/tools/windows.ps1 build/tools build/tool-sources
      - name: Freeze
        shell: pwsh
        run: |
          pip install -r packaging/requirements-build.txt
          python packaging/build.py --version $env:VERSION --tools build/tools --out dist
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Check the download starts
        shell: pwsh
        run: |
          Expand-Archive "dist/DiscForge-$env:VERSION-windows-x86_64.zip" build/check
          $app = "build/check/DiscForge"
          & "$app/discforge-cli.exe" --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & "$app/discforge-cli.exe" doctor
          $env:DISCFORGE_SELF_TEST_REPORT = "$PWD/build/self-test.txt"
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process "$app/DiscForge.exe" -ArgumentList "--self-test" -Wait -PassThru
          Get-Content build/self-test.txt
          if ($p.ExitCode -ne 0) { exit 1 }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x86_64
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sources-windows
          path: build/tool-sources/*
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: aarch64, os: macos-15 }
          - { arch: x86_64, os: macos-15-intel }
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Burning tools
        run: |
          brew install smake
          bash packaging/tools/macos.sh build/tools build/tool-sources
      - name: Freeze
        run: |
          pip install -r packaging/requirements-build.txt
          python packaging/build.py --version "$VERSION" --tools build/tools --out dist
      - name: Check the download starts
        run: |
          mkdir -p build/check && ditto -x -k "dist/DiscForge-$VERSION-macos-${{ matrix.arch }}.zip" build/check
          app=build/check/DiscForge.app/Contents/MacOS
          codesign --verify --deep --strict build/check/DiscForge.app
          "$app/discforge-cli" --version
          "$app/discforge-cli" doctor
          DISCFORGE_SELF_TEST_REPORT=$PWD/build/self-test.txt QT_QPA_PLATFORM=offscreen "$app/DiscForge" --self-test \
            || { cat build/self-test.txt; exit 1; }
          cat build/self-test.txt
          grep -q "bundled" build/self-test.txt
          # every bundled tool must start from inside the bundle (signed, system libraries only)
          t=build/check/DiscForge.app/Contents/Resources/tools/bin
          "$t/cdrecord" -version 2>&1 | grep -i "cdrecord"
          "$t/readcd" -version 2>&1 | grep -i "readcd"
          "$t/mkisofs" -version 2>&1 | grep -i "mkisofs"
          { "$t/cdrdao" 2>&1 || true; } | grep -i "cdrdao version"
          "$t/7zz" i | grep "7-Zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  freebsd:
    name: FreeBSD
    needs: version
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          release: "14.3"
          envs: VERSION
          prepare: |
            pkg install -y python3 python312 py312-pyside6 py312-numpy py312-lz4 cdrtools cdrdao dvd+rw-tools
          run: |
            set -e
            python3.12 packaging/build.py --version "$VERSION" --out dist
            mkdir -p build/check && tar -xzf "dist/DiscForge-$VERSION-freebsd-x86_64.tar.gz" -C build/check
            build/check/DiscForge/discforge.sh --version
            build/check/DiscForge/discforge.sh doctor
            QT_QPA_PLATFORM=offscreen DISCFORGE_SELF_TEST_REPORT=$PWD/build/self-test.txt \
              build/check/DiscForge/discforge.sh gui --self-test || { cat build/self-test.txt; exit 1; }
            cat build/self-test.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: freebsd
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish
    needs: [version, linux, appimage, windows, macos, freebsd]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: build/artifacts
      - name: Collect the downloads, tool sources and checksums
        run: |
          mkdir -p dist build/sources
          for d in build/artifacts/*; do
            case "$(basename "$d")" in
              sources-*) cp -n "$d"/* build/sources/ ;;
              *) cp "$d"/* dist/ ;;
            esac
          done
          ls -l build/sources
          tar -cf "dist/DiscForge-$VERSION-tool-sources.tar" -C build/sources .
          git archive --format=tar.gz --prefix="DiscForge-$VERSION/" -o "dist/DiscForge-$VERSION-source.tar.gz" HEAD
          (cd dist && sha256sum DiscForge-* > "DiscForge-$VERSION-SHA256SUMS")
          cat "dist/DiscForge-$VERSION-SHA256SUMS"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref_type != 'tag'
        with:
          name: release-files
          path: dist/*
      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag $prerelease \
            --title "DiscForge $VERSION" \
            --notes-file "docs/releases/$VERSION.md" \
            dist/DiscForge-"$VERSION"-*
